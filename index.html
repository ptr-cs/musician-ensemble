<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musician Ensemble — Mozart K. 581</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23d9a441'/%3E%3Cpath d='M13 8v12.5a3.5 3.5 0 1 1-2-3.2V8h9v4h-7z' fill='%230d0b10'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div>
          <p class="eyebrow">W. A. Mozart · 1789</p>
          <h1>Clarinet Quintet in A major, K. 581</h1>
          <p class="subtitle">I. Allegro · bars 1–39 · performed live by five AI musicians</p>
        </div>
        <dl class="insight" id="insight">
          <div><dt>Key</dt><dd id="insight-key">—</dd></div>
          <div><dt>Harmony</dt><dd id="insight-chord">—</dd></div>
          <div><dt>Phrase</dt><dd id="insight-phrase">—</dd></div>
          <div><dt>Melody</dt><dd id="insight-lead">—</dd></div>
        </dl>
      </header>

      <main class="hall">
        <div class="stage" id="stage"></div>
      </main>

      <section class="score-strip" aria-label="Score and analysis">
        <canvas id="score"></canvas>
      </section>

      <footer class="transport">
        <button id="play" class="play" type="button" aria-label="Perform">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z" /></svg>
          <span id="play-label">Perform</span>
        </button>
        <button id="conduct" class="conduct" type="button" aria-pressed="false" title="Conduct the ensemble with your camera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5 19 5" /><circle cx="5" cy="19" r="2" /></svg>
          <span>Conduct</span>
        </button>
        <div class="readouts">
          <div class="readout">
            <span class="readout-label">Bar</span>
            <span class="readout-value" id="bar">1</span>
            <span class="readout-label">Beat</span>
            <span class="readout-value" id="beat">1</span>
          </div>
          <div class="readout">
            <span class="readout-label">Tempo</span>
            <span class="readout-value" id="tempo">♩ = —</span>
          </div>
        </div>
        <div class="mode" role="radiogroup" aria-label="Performance mode">
          <button type="button" role="radio" aria-checked="true" data-mode="expressive" class="active">Interpretive</button>
          <button type="button" role="radio" aria-checked="false" data-mode="literal">Literal</button>
        </div>
        <p class="status" id="status">Loading the score…</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
